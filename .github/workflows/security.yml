name: Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # o deploy chama isto como portão antes de publicar

permissions:
  contents: read

jobs:
  segredos:
    name: Segredos e ficheiros proibidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks precisa do histórico todo, não só do último commit

      - name: Varrer histórico à procura de segredos
        run: |
          # Binário direto em vez da action oficial: ela deriva um range
          # <antes>^..<depois> e no primeiro commit do repositório o `^` aponta
          # para um pai que não existe, abortando o scan. `gitleaks git` varre o
          # histórico inteiro e não depende de aritmética de commits.
          versao=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${versao}/gitleaks_${versao}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose --exit-code 1

      - name: Ficheiros que nunca podem entrar no repositório
        run: |
          # Não é redundante com o .gitignore: o .gitignore é uma intenção que
          # `git add -f` ignora. Isto é o portão.
          padroes='(^|/)\.env($|\.)|(^|/)wp-config\.php$|\.(sql|sql\.gz|sqlite|pem|key|p12|pfx)$|(^|/)\.htpasswd$|(^|/)id_(rsa|ed25519)$'
          encontrados=$(git ls-files | grep -iE "$padroes" || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Ficheiros sensíveis versionados:"
            echo "$encontrados"
            exit 1
          fi
          echo "Nenhum ficheiro sensível versionado."

  php:
    name: PHP — sintaxe e regras do tema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # o mínimo declarado em style.css: se parte aqui, parte em produção
          coverage: none

      - name: Sintaxe
        run: |
          erros=0
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null || { echo "::error file=$f::erro de sintaxe"; erros=1; }
          done
          exit $erros

      - name: Guarda ABSPATH em todos os ficheiros
        run: |
          # Sem esta guarda, abrir o .php pelo URL direto executa-o fora do
          # WordPress — sem utilizador, sem nonce, sem capacidades.
          falhou=0
          for f in $(git ls-files '*.php'); do
            grep -q "defined( 'ABSPATH' )" "$f" || { echo "::error file=$f::sem guarda ABSPATH"; falhou=1; }
          done
          exit $falhou

      - name: Funções proibidas
        run: |
          padrao='\b(eval|assert|create_function|shell_exec|passthru|proc_open|popen|system|exec|base64_decode|unserialize)[[:space:]]*\('
          if grep -rnE "$padrao" $(git ls-files '*.php'); then
            echo "::error::Função proibida encontrada."
            exit 1
          fi
          echo "Nenhuma função proibida."

      - name: Superglobais sem sanitização
        run: |
          # $_GET/$_POST/$_REQUEST têm de passar por wp_unslash + sanitize_*.
          # Sinaliza, não bloqueia: há usos legítimos que este regex não entende.
          grep -rnE '\$_(GET|POST|REQUEST)\[' $(git ls-files '*.php') \
            | grep -vE 'wp_unslash|sanitize_|wp_verify_nonce|absint|\(int\)|empty\(|isset\(' \
            && echo "::warning::Superglobais acima sem sanitização visível." || true

  dependencias:
    name: Dependências de build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Auditar o que é entregue
        run: |
          # O tema não envia uma linha de npm para o servidor: o deploy leva CSS
          # e JS compilados, e o package.json nem entra no pacote. Este é o
          # portão a sério — qualquer dependência de produção é bloqueante.
          npm audit --omit=dev --audit-level=moderate

      - name: Auditar dependências de build
        run: |
          # Correm na máquina de quem compila, nunca em produção. Hoje falha por
          # ReDoS no minimatch, via grunt-contrib-watch, que é o observador de
          # ficheiros do `npm run watch`. Avisa, não bloqueia: um portão que
          # falha por algo que não é entregue acaba por ser desligado.
          npm audit --audit-level=high || \
            echo "::warning::Vulnerabilidades em dependências de build. Não são entregues, mas convém rever."
